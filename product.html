<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purse · Funkyfreshe</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Purse · Funkyfreshe">
<meta property="og:description" content="Funkyfreshe: handmade, one-of-a-kind purses built from thrifted bags and recycled watch faces.">
<meta property="og:image" content="https://ssn56-boop.github.io/funkyfreshe/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ssn56-boop.github.io/funkyfreshe/product.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Purse · Funkyfreshe">
<meta name="twitter:description" content="Funkyfreshe: handmade, one-of-a-kind purses built from thrifted bags and recycled watch faces.">
<meta name="twitter:image" content="https://ssn56-boop.github.io/funkyfreshe/images/og-image.jpg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Funky<em>freshe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="story.html">Our Story</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="customers.html">Customers</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li>
        <a href="cart.html" class="cart-link" aria-label="View cart">
          Cart <span class="cart-badge" data-count="0">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<section class="wrap" style="padding-top:48px;">
  <div id="product-body"></div>
</section>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button id="lightbox-close" class="lightbox-close" aria-label="Close zoomed photo">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function placeholderSVG() {
    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7" stroke="currentColor" stroke-width="1.6"/>
    </svg>`;
  }

  function zoomSVG() {
    return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M15.2 15.2L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M10.5 8v5M8 10.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>`;
  }

  function getProduct() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    return (window.FF_PRODUCTS || []).find((p) => p.id === id);
  }

  function renderProduct() {
    const body = document.getElementById("product-body");
    const product = getProduct();

    if (!product) {
      body.innerHTML = `
        <div class="shop-empty">
          <p>We couldn't find that purse.</p>
          <a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Back to shop</a>
        </div>`;
      return;
    }

    const photos = [product.image, ...(product.gallery || [])].filter(Boolean);
    const mainPhotoHtml = photos.length
      ? `<img id="product-main-img" src="${photos[0]}" alt="${escapeHtml(product.name)}">
         <button id="zoom-btn" class="zoom-btn" type="button" aria-label="Zoom in on photo">${zoomSVG()} Zoom</button>`
      : `<div class="placeholder">${placeholderSVG()}<br>Add photos in js/products.js</div>`;

    const thumbsHtml = photos.length > 1
      ? `<div class="product-thumbs">${photos.map((src, i) => `
          <button data-src="${src}" class="${i === 0 ? 'is-active' : ''}" aria-label="Show photo ${i + 1}">
            <img src="${src}" alt="">
          </button>`).join("")}</div>`
      : "";

    document.title = product.name + " · Funkyfreshe";
    const isInCart = FFCart.isInCart(product.id);

    body.innerHTML = `
      <div class="product-grid">
        <div>
          <div class="product-main-photo ${photos.length ? '' : 'is-empty'}">${mainPhotoHtml}</div>
          ${thumbsHtml}
        </div>
        <div class="product-info">
          ${!product.inStock ? '<span class="sold-badge">Sold</span>' : ''}
          <span class="eyebrow">One of a kind</span>
          <h1 style="margin-top:8px;">${escapeHtml(product.name)}</h1>
          <div class="product-price">${Number(product.price || 0).toFixed(2)}</div>
          <p class="product-desc">${escapeHtml(product.description || "No description yet — add one in js/products.js.")}</p>
          <button id="product-add" class="btn btn-primary btn-block" ${product.inStock ? "" : "disabled"}>
            ${!product.inStock ? "Sold out" : (isInCart ? "In cart ✓" : "Add to cart")}
          </button>
          <a href="shop.html" class="back-to-shop">&larr; Back to all purses</a>
        </div>
      </div>
    `;

    if (thumbsHtml) {
      body.querySelectorAll(".product-thumbs button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById("product-main-img").src = btn.getAttribute("data-src");
          body.querySelectorAll(".product-thumbs button").forEach((b) => b.classList.remove("is-active"));
          btn.classList.add("is-active");
        });
      });
    }

    const zoomBtn = document.getElementById("zoom-btn");
    if (zoomBtn) {
      zoomBtn.addEventListener("click", () => openLightbox());
    }
    const mainImg = document.getElementById("product-main-img");
    if (mainImg) {
      mainImg.style.cursor = "zoom-in";
      mainImg.addEventListener("click", () => openLightbox());
    }

    const addBtn = document.getElementById("product-add");
    addBtn.addEventListener("click", () => {
      if (addBtn.disabled) return;
      if (FFCart.isInCart(product.id)) return; // one-of-a-kind — already in the cart
      FFCart.addItem(product.id, 1);
      addBtn.textContent = "In cart ✓";
    });
  }

  document.addEventListener("DOMContentLoaded", renderProduct);

  function openLightbox() {
    const mainImg = document.getElementById("product-main-img");
    if (!mainImg) return;
    document.getElementById("lightbox-img").src = mainImg.src;
    document.getElementById("lightbox-img").alt = mainImg.alt;
    document.getElementById("lightbox").classList.add("is-open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("is-open");
    document.body.style.overflow = "";
  }
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", (e) => {
    if (e.target.id === "lightbox") closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });
</script>
</body>
</html>
