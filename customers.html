<script>
  (function () {
    const photos = window.FF_CUSTOMERS || [];
    const gallery = document.getElementById("customer-gallery");

    if (photos.length === 0) {
      gallery.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--ink-soft);">No photos yet — add some in js/customers.js.</p>`;
      return;
    }

    gallery.innerHTML = photos.map((photo, i) => `
      <figure class="cust-item" style="transition-delay:${(i % 3) * 90}ms;">
        <div class="cust-photo">
          <img src="${photo.image}" alt="${(photo.caption || "Funkyfreshe customer photo").replace(/"/g, "&quot;")}" loading="lazy">
        </div>
        <figcaption class="cust-caption">${photo.caption || ""}</figcaption>
      </figure>
    `).join("");

    // Reveal each photo as it scrolls into view, instead of showing
    // them all at once — the further you scroll, the more appear.
    const items = gallery.querySelectorAll(".cust-item");
    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -60px 0px" });

      items.forEach((item) => observer.observe(item));
    } else {
      // No IntersectionObserver support — just show everything.
      items.forEach((item) => item.classList.add("is-visible"));
    }
  })();
</script>
