<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Customers · Funkyfreshe</title>
<meta name="description" content="Funkyfreshe purses and custom banners out in the wild, with the people who bought them.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Funky<em>freshe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="story.html">Our Story</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="customers.html" class="active">Customers</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li>
        <a href="cart.html" class="cart-link" aria-label="View cart">
          Cart <span class="cart-badge" data-count="0">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<header class="page-hero wrap">
  <span class="eyebrow">Out in the wild</span>
  <h1>Past customers</h1>
  <p>Purses and custom banners, carried and hung by the people who bought them. Use the arrows to look through.</p>
</header>

<section class="wrap" style="padding-bottom:100px;">
  <div class="carousel">
    <div class="carousel-frame">
      <img id="carousel-img" src="" alt="">
    </div>
    <p class="carousel-caption" id="carousel-caption"></p>
    <div class="carousel-controls">
      <button class="carousel-arrow" id="carousel-prev" aria-label="Previous photo">&larr;</button>
      <button class="carousel-arrow" id="carousel-next" aria-label="Next photo">&rarr;</button>
    </div>
    <div class="carousel-dots" id="carousel-dots"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/customers.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  (function () {
    const photos = window.FF_CUSTOMERS || [];
    let index = 0;

    const img = document.getElementById("carousel-img");
    const caption = document.getElementById("carousel-caption");
    const dotsWrap = document.getElementById("carousel-dots");
    const prevBtn = document.getElementById("carousel-prev");
    const nextBtn = document.getElementById("carousel-next");

    function render() {
      if (photos.length === 0) {
        caption.textContent = "No photos yet — add some in js/customers.js.";
        return;
      }
      const photo = photos[index];
      img.src = photo.image;
      img.alt = photo.caption || "Funkyfreshe customer photo";
      caption.textContent = photo.caption || "";
      dotsWrap.querySelectorAll("button").forEach((dot, i) => {
        dot.classList.toggle("is-active", i === index);
      });
    }

    function renderDots() {
      dotsWrap.innerHTML = photos.map((_, i) =>
        `<button aria-label="Go to photo ${i + 1}" data-i="${i}"></button>`
      ).join("");
      dotsWrap.querySelectorAll("button").forEach((dot) => {
        dot.addEventListener("click", () => {
          index = Number(dot.getAttribute("data-i"));
          render();
        });
      });
    }

    prevBtn.addEventListener("click", () => {
      if (photos.length === 0) return;
      index = (index - 1 + photos.length) % photos.length;
      render();
    });
    nextBtn.addEventListener("click", () => {
      if (photos.length === 0) return;
      index = (index + 1) % photos.length;
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
    });

    renderDots();
    render();
  })();
</script>
</body>
</html>
