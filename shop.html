<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop · Funky Freshe</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Funky <em>Freshe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="story.html">Our Story</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="customers.html">Customers</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li>
        <a href="cart.html" class="cart-link" aria-label="View cart">
          Cart <span class="cart-badge" data-count="0">0</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<header class="page-hero wrap">
  <span class="eyebrow">One of a kind</span>
  <h1>Shop the purses</h1>
  <p>Every watch purse is handmade in small batches. Tap a tag to add it to your cart.</p>
</header>

<section class="wrap">
  <div id="shop-grid" class="shop-grid"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funky Freshe &middot; Handmade earrings &amp; watch purses, made in Cincinnati, Ohio since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  function placeholderSVG() {
    return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7" stroke="currentColor" stroke-width="1.6"/>
    </svg>`;
  }

  function renderShop() {
    const grid = document.getElementById("shop-grid");
    // Each purse is one-of-a-kind — once it's sold, it comes off the shop
    // page entirely rather than sticking around unpurchasable.
    const products = (window.FF_PRODUCTS || []).filter((p) => p.inStock);

    if (products.length === 0) {
      grid.innerHTML = `<div class="shop-empty">No purses listed yet — add some in js/products.js.</div>`;
      return;
    }

    grid.innerHTML = products.map((p) => {
      const photo = p.image
        ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">`
        : `<div class="placeholder">${placeholderSVG()}Add a photo in<br>js/products.js</div>`;

      return `
        <article class="tag-card" data-id="${p.id}">
          <div class="tag-string"></div>
          <div class="tag-hole"></div>
          <a class="tag-link" href="product.html?id=${encodeURIComponent(p.id)}">
            <div class="tag-photo ${p.image ? '' : 'is-empty'}">${photo}</div>
            <div class="tag-body">
              <h3>${escapeHtml(p.name)}</h3>
              <p class="tag-desc">${escapeHtml(p.description || "")}</p>
              <div class="tag-barcode" aria-hidden="true"></div>
              <span class="tag-sku">No. ${escapeHtml(p.id)}</span>
            </div>
          </a>
          <div class="tag-footer">
            <span class="tag-price">${Number(p.price || 0).toFixed(2)}</span>
            <button class="tag-add" data-id="${p.id}">Add to cart</button>
          </div>
        </article>
      `;
    }).join("");

    grid.querySelectorAll(".tag-add").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        FFCart.addItem(id, 1);
        const original = btn.textContent;
        btn.textContent = "Added ✓";
        btn.classList.add("added");
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove("added");
        }, 1200);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  document.addEventListener("DOMContentLoaded", renderShop);
</script>
</body>
</html>
