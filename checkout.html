<header class="page-hero wrap">
  <div class="text-bubble">
    <span class="eyebrow">Pay for each piece</span>
    <h1>Checkout</h1>
  </div>
  </header>

<section class="wrap">
  <div id="checkout-body"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script>
  const body = document.getElementById("checkout-body");
  const cfg = window.FF_CONFIG || {};

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function renderEmptyState() {
    body.innerHTML = `
      <div class="empty-cart">
        <p>Your cart is empty, so there's nothing to check out yet.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Browse the purses</a>
      </div>`;
  }

  function goToPayment() {
    const items = FFCart.getLineItems();
    const allHaveSquareLink = items.length > 0 && items.every(i => (window.FF_PRODUCTS || []).find(p => p.id === i.id && p.squareCheckoutUrl));

    if (allHaveSquareLink) {
      renderSquarePayment(items);
    } else {
      renderManualPayment();
    }
  }

  function renderSquarePayment(items) {
    const links = items.map((i) => {
      const product = (window.FF_PRODUCTS || []).find(p => p.id === i.id);
      return `<a href="${product.squareCheckoutUrl}" class="btn btn-primary" style="margin:6px;" target="_blank" rel="noopener">Pay for ${escapeHtml(i.name)}</a>`;
    }).join("");

    body.innerHTML = `
      <div class="order-confirm">
        <h2>Pay securely with Square</h2>
        <p style="max-width:460px; margin:14px auto 26px; color:var(--ink-soft);">
          Each purse only has one to sell, so it gets its own secure Square checkout page (card, Apple Pay, or Google Pay accepted).
          ${items.length > 1 ? "Please pay for each item below." : ""}
          Nothing is finalized until you complete payment there — you'll get an automatic receipt by email from Square, and land back here once you're done.
        </p>
        <div style="display:flex; flex-wrap:wrap; justify-content:center;">${links}</div>
        <a href="index.html" class="btn-ghost" style="display:inline-block; margin-top:24px;">Cancel and go home</a>
      </div>
    `;
  }

  function renderManualPayment() {
    body.innerHTML = `
      <div class="order-confirm">
        <h2>Almost ready</h2>
        <p style="max-width:440px; margin:18px auto; color:var(--ink-soft);">
          One or more items in your cart don't have a payment link set up yet — email us and we'll send one over.
        </p>
        <a href="contact.html" class="btn btn-primary" style="margin-top:10px;">Contact us</a>
      </div>
    `;
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (FFCart.getLineItems().length === 0) {
      renderEmptyState();
    } else {
      goToPayment();
    }
  });
</script>
</body>
</html>
