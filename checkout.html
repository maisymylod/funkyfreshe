<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Funky<em>freshe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="story.html">Our Story</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="customers.html">Customers</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="cart.html" class="cart-link" aria-label="View cart">
        Cart <span class="cart-badge" data-count="0">0</span>
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<header class="page-hero wrap">
  <div class="text-bubble">
    <span class="eyebrow">Almost there</span>
    <h1>Checkout</h1>
  </div>
</header>

<section class="wrap">
  <div id="checkout-body"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script>
  const body = document.getElementById("checkout-body");
  const cfg = window.FF_CONFIG || {};

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function getTotals() {
    const subtotal = FFCart.getSubtotal();
    const shipping = Number(cfg.SHIPPING_FLAT_RATE) || 0;
    const tax = subtotal * (Number(cfg.TAX_RATE) || 0);
    const total = subtotal + shipping + tax;
    return { subtotal, shipping, tax, total };
  }

  function renderEmptyState() {
    body.innerHTML = `
      <div class="empty-cart">
        <p>Your cart is empty, so there's nothing to check out yet.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Browse the purses</a>
      </div>`;
  }

  function renderForm() {
    const items = FFCart.getLineItems();
    const { subtotal, shipping, tax, total } = getTotals();

    const receiptRows = items.map(i => `
      <div class="receipt-item">
        <span>${escapeHtml(i.name)}</span>
        <span>$${FFCart.formatMoney(i.lineTotal)}</span>
      </div>
    `).join("");

    body.innerHTML = `
      <div class="checkout-grid">
        <div class="form-card">
          <h3 style="margin-bottom:18px;">Shipping details</h3>
          <form id="checkout-form">
            <div class="field-row">
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" required>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" required>
              </div>
            </div>
            <div class="field">
              <label for="address">Shipping address</label>
              <input id="address" required placeholder="Street, city, state, ZIP">
            </div>
            <div class="field">
              <label for="notes">Order notes (optional)</label>
              <textarea id="notes" rows="3" placeholder="Anything we should know?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Continue to payment</button>
          </form>
        </div>

        <div class="receipt-card">
          <h3>Order summary</h3>
          <div class="receipt-items">${receiptRows}</div>
          <div class="summary-row"><span>Subtotal</span><span>$${FFCart.formatMoney(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>$${FFCart.formatMoney(shipping)}</span></div>
          <div class="summary-row"><span>Tax</span><span>$${FFCart.formatMoney(tax)}</span></div>
          <div class="summary-row total"><span>Total</span><span>$${FFCart.formatMoney(total)}</span></div>
          <div class="pay-note">You'll pay on the next step, by card or PayPal. We'll confirm your order by email once payment is received.</div>
        </div>
      </div>
    `;

    document.getElementById("checkout-form").addEventListener("submit", (e) => {
      e.preventDefault();
      goToPayment({
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        notes: document.getElementById("notes").value.trim()
      });
    });
  }

  function sendOrderEmail(customer, orderId, totals) {
    const items = FFCart.getLineItems();
    const itemLines = items.map(i => `${i.name} — $${FFCart.formatMoney(i.lineTotal)}`).join("%0D%0A");
    const mailBody =
      `Order ${orderId}%0D%0A%0D%0A` +
      `${itemLines}%0D%0A%0D%0A` +
      `Subtotal: $${FFCart.formatMoney(totals.subtotal)}%0D%0A` +
      `Shipping: $${FFCart.formatMoney(totals.shipping)}%0D%0A` +
      `Tax: $${FFCart.formatMoney(totals.tax)}%0D%0A` +
      `Total: $${FFCart.formatMoney(totals.total)}%0D%0A%0D%0A` +
      `Name: ${customer.name}%0D%0AEmail: ${customer.email}%0D%0AShip to: ${customer.address}%0D%0ANotes: ${customer.notes || "—"}`;
    return `mailto:${encodeURIComponent(cfg.CONTACT_EMAIL || "")}?subject=${encodeURIComponent("Order " + orderId)}&body=${mailBody}`;
  }

  function goToPayment(customer) {
    const totals = getTotals();
    const orderId = "FF-" + Date.now().toString().slice(-6);
    const mailUrl = sendOrderEmail(customer, orderId, totals);

    // Let you know an order is coming, right away — before payment even completes.
    window.location.href = mailUrl;

    if (cfg.PAYPAL_CLIENT_ID) {
      renderSecurePayment(customer, orderId, totals, mailUrl);
    } else {
      renderManualPayment(customer, orderId, totals, mailUrl);
    }
  }

  function renderSecurePayment(customer, orderId, totals, mailUrl) {
    body.innerHTML = `
      <div class="order-confirm">
        <span class="stamp">Order ${orderId}</span>
        <h2>Pay $${FFCart.formatMoney(totals.total)} to finish</h2>
        <p style="max-width:440px; margin:14px auto 26px; color:var(--ink-soft);">
          Pay securely by card or PayPal below — your card details go straight to PayPal, never through this site.
        </p>
        <div id="paypal-button-container" style="max-width:420px; margin:0 auto;"></div>
        <p id="paypal-fallback-note" style="display:none; color:var(--ink-soft); font-size:13px; margin-top:16px;">
          Payment buttons couldn't load. <a href="${mailUrl}" style="text-decoration:underline;">Email us your order</a> and we'll send a secure payment link instead.
        </p>
        <a href="index.html" class="btn-ghost" style="display:inline-block; margin-top:24px;">Cancel and go home</a>
      </div>
    `;

    const script = document.createElement("script");
    script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.PAYPAL_CLIENT_ID)}&currency=USD`;
    script.onload = () => {
      if (!window.paypal) { showPaypalFallback(); return; }
      window.paypal.Buttons({
        style: { shape: "pill", height: 45 },
        createOrder: (data, actions) => actions.order.create({
          purchase_units: [{ amount: { value: totals.total.toFixed(2) } }]
        }),
        onApprove: (data, actions) => actions.order.capture().then(() => {
          FFCart.clearCart();
          showPaidConfirmation(customer, orderId, totals);
        }),
        onError: () => showPaypalFallback()
      }).render("#paypal-button-container");
    };
    script.onerror = showPaypalFallback;
    document.head.appendChild(script);
  }

  function showPaypalFallback() {
    const note = document.getElementById("paypal-fallback-note");
    if (note) note.style.display = "block";
  }

  function showPaidConfirmation(customer, orderId, totals) {
    body.innerHTML = `
      <div class="order-confirm">
        <span class="stamp">Payment received</span>
        <h2>Thanks, ${escapeHtml(customer.name.split(" ")[0] || "friend")}!</h2>
        <p class="order-id">Order ${orderId} &middot; Total $${FFCart.formatMoney(totals.total)}</p>
        <p style="max-width:440px; margin:18px auto; color:var(--ink-soft);">
          Your payment went through. We'll get your purse packed up and shipped out soon.
        </p>
        <a href="index.html" class="btn btn-primary" style="margin-top:10px;">Back to home</a>
      </div>
    `;
  }

  function renderManualPayment(customer, orderId, totals, mailUrl) {
    const paypalAmount = totals.total.toFixed(2);
    const paypalUrl = `https://paypal.me/${encodeURIComponent(cfg.PAYPAL_USERNAME || "")}/${paypalAmount}`;

    FFCart.clearCart();

    body.innerHTML = `
      <div class="order-confirm">
        <span class="stamp">Order placed</span>
        <h2>Thanks, ${escapeHtml(customer.name.split(" ")[0] || "friend")}!</h2>
        <p class="order-id">Order ${orderId} &middot; Total $${FFCart.formatMoney(totals.total)}</p>
        <p style="max-width:440px; margin:18px auto; color:var(--ink-soft);">
          Two quick steps to finish: send your payment on PayPal, then email us your order so we can match it up.
        </p>
        <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
          <a href="${paypalUrl}" target="_blank" rel="noopener" class="btn btn-primary">Pay $${paypalAmount} with PayPal</a>
          <a href="${mailUrl}" class="btn btn-outline">Email order details</a>
        </div>
        <a href="index.html" class="btn-ghost" style="display:inline-block; margin-top:24px;">Back to home</a>
      </div>
    `;
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (FFCart.getLineItems().length === 0) {
      renderEmptyState();
    } else {
      renderForm();
    }
  });
</script>
</body>
</html>
