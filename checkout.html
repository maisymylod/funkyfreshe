<header class="page-hero wrap">
  <div class="text-bubble">
    <span class="eyebrow">Almost there</span>
    <h1>Checkout</h1>
  </div>
  </header>

<section class="wrap">
  <div id="checkout-body"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script>
  const body = document.getElementById("checkout-body");
  const cfg = window.FF_CONFIG || {};

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function getTotals() {
    // Square's checkout page calculates shipping and tax itself — this
    // site only ever shows the subtotal for the one-of-a-kind piece(s).
    const subtotal = FFCart.getSubtotal();
    return { subtotal };
  }

  function renderEmptyState() {
    body.innerHTML = `
      <div class="empty-cart">
        <p>Your cart is empty, so there's nothing to check out yet.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:12px;">Browse the purses</a>
      </div>`;
  }

  function renderForm() {
    const items = FFCart.getLineItems();
    const { subtotal } = getTotals();
    const storefrontUrl = cfg.STOREFRONT_URL;

    const receiptRows = items.map(i => `
      <div class="receipt-item">
        <span>${escapeHtml(i.name)}</span>
        <span>$${FFCart.formatMoney(i.lineTotal)}</span>
      </div>
    `).join("");

    const itemNames = items.map(i => escapeHtml(i.name)).join(", ");

    body.innerHTML = `
      <div class="checkout-grid">
        <div class="form-card">
          <h3 style="margin-bottom:8px;">Ready to check out</h3>
          <p style="color:var(--ink-soft); margin-bottom:18px;">
            Purchases happen on our secure Square store, where shipping and tax are calculated for you based on your
            address. You'll pick up your item${items.length > 1 ? "s" : ""} — ${itemNames} — there and pay directly with Square.
          </p>
          <button id="continue-btn" class="btn btn-primary btn-block">Go to secure checkout</button>
        </div>

        <div class="receipt-card">
          <h3>Order summary</h3>
          <div class="receipt-items">${receiptRows}</div>
          <div class="summary-row total"><span>Subtotal</span><span>$${FFCart.formatMoney(subtotal)}</span></div>
          <div class="pay-note">Shipping and any applicable sales tax are calculated on our Square store, based on your address. Nothing is charged and no order is placed until payment goes through there.</div>
        </div>
      </div>
    `;

    document.getElementById("continue-btn").addEventListener("click", () => {
      window.open(storefrontUrl, "_blank", "noopener");
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (FFCart.getLineItems().length === 0) {
      renderEmptyState();
    } else {
      renderForm();
    }
  });
</script>
</body>
</html>
