<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed · Funkyfreshe</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Funky<em>freshe</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="story.html">Our Story</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="customers.html">Customers</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a href="cart.html" class="cart-link" aria-label="View cart">
        Cart <span class="cart-badge" data-count="0">0</span>
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<section class="wrap">
  <div id="confirm-body" class="order-confirm" style="padding:60px 0;"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    Funkyfreshe &middot; Handmade earrings &amp; watch purses, made in New York since 2021.
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/nav.js"></script>
<script>
  // Square appends orderId / transactionId / referenceId / checkoutId to the
  // redirect URL only on a successful payment. Their presence is our signal
  // that the order actually went through — this page (not the checkout
  // page) is the one true "order placed" moment.
  const params = new URLSearchParams(window.location.search);
  const paid = params.has("orderId") || params.has("transactionId") || params.has("checkoutId") || params.has("referenceId");
  const body = document.getElementById("confirm-body");

  if (paid) {
    FFCart.clearCart();
    body.innerHTML = `
      <span class="stamp">Payment received</span>
      <h2>Thank you!</h2>
      <p style="max-width:460px; margin:18px auto; color:var(--ink-soft);">
        Your payment went through and your purse is officially sold. Square has sent (or is sending) a receipt to the email
        you entered at checkout — that's your order confirmation. We'll get it packed up and shipped out soon.
      </p>
      <a href="shop.html" class="btn btn-primary" style="margin-top:10px;">Keep browsing</a>
    `;
  } else {
    body.innerHTML = `
      <h2>No payment detected</h2>
      <p style="max-width:460px; margin:18px auto; color:var(--ink-soft);">
        If you cancelled or closed the Square checkout page before finishing, nothing was charged and no order was placed.
        Your cart is still waiting for you if you'd like to try again.
      </p>
      <a href="cart.html" class="btn btn-primary" style="margin-top:10px;">Back to cart</a>
    `;
  }
</script>
</body>
</html>
